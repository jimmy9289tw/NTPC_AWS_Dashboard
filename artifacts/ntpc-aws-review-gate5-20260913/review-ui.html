<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>新北青年資料｜管理者查核</title>
<style>
:root{color:#12384d;background:#f3f7f8;font:16px/1.65 system-ui,"Microsoft JhengHei",sans-serif}*{box-sizing:border-box}body{margin:0}header{background:#12384d;color:white;padding:26px max(24px,calc((100vw - 1240px)/2))}header p{margin:8px 0}h1{font-size:28px;margin:0}main{max-width:1240px;margin:28px auto;padding:0 24px}button,select,textarea{font:inherit}button{background:#117c80;border:0;border-radius:6px;padding:10px 16px;color:white;cursor:pointer}button:disabled{opacity:.5;cursor:default}button.secondary{background:#e5eeee;color:#12384d}button:focus-visible,a:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #c98210;outline-offset:3px}.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.layout{display:grid;grid-template-columns:300px 1fr;gap:24px;margin-top:22px}section,aside{background:white;padding:22px;border:1px solid #dae5e7;border-radius:10px}h2{margin:0 0 14px;font-size:21px}.case{display:block;width:100%;background:#f1f6f6;color:#12384d;text-align:left;margin:10px 0;overflow-wrap:anywhere}.case small{display:block}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;background:#f4f7f7;padding:14px}label{display:block;font-weight:600;margin:18px 0 8px}select,textarea{width:100%;padding:10px;border:1px solid #a7bec4;border-radius:5px}textarea{min-height:100px}.warning{border-left:5px solid #c98210;padding:10px 16px;background:#fff7e7}.error{color:#a12e29}#message{min-height:30px;white-space:pre-wrap}.hidden{display:none}.issue{padding:12px 0;border-bottom:1px solid #dbe7e7}.muted{color:#536d78;font-size:14px}dl{display:grid;grid-template-columns:130px 1fr;gap:8px;margin:0}dt{font-weight:600}dd{margin:0;overflow-wrap:anywhere}a{color:#117c80}@media(max-width:800px){.layout{grid-template-columns:1fr}main{padding:0 14px}header{padding:22px}dl{grid-template-columns:1fr}}
</style><script src="/review/app.js" defer></script></head><body>
<header><h1>新北青年資料｜管理者查核</h1><p>資料有問題時保留有效版本，完成復驗與具名確認後再發布。</p></header>
<main><div class="tools"><button id="login">管理者登入</button><button id="refresh" class="secondary" disabled>重新整理案件</button><span id="identity" class="muted">尚未登入</span></div><p id="message" role="status" aria-live="polite"></p>
<p class="warning">受理、已讀與未回覆都不代表核可。Excel 供查閱與留存；簽核需在此入口完成。</p>
<div class="layout"><aside><h2>查核案件</h2><div id="cases">登入後載入案件。</div></aside><section><h2 id="heading">選擇案件</h2><div id="detail">檢視問題、候選版本與復驗結果。</div><div id="actions" class="hidden"><p><button id="download" class="secondary">下載本次查核表</button></p><label for="decision">處置方式</label><select id="decision"><option value="ACKNOWLEDGE">受理（不發布）</option><option value="RETURN">退回修正</option><option value="WAIT_SOURCE">等待官方補件</option><option value="REJECT">駁回本版（保留舊版）</option><option value="APPROVE">核可此候選版本並發布</option></select><label for="reason">處理理由與依據（至少 5 字）</label><textarea id="reason" maxlength="2000"></textarea><p id="approval-note" class="muted"></p><button id="submit">送出处置</button></div></section></div>
</main></body></html>
